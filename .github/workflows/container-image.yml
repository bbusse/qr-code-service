---
name: Build and push container

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container-build-push:
    name: Build and push container
    uses: bbusse/github-workflows/.github/workflows/container-build-push.yml@dev
    with:
      image_name: qr-code-service
      image_repository: ghcr.io/bbusse
      container_registry: ghcr
      container_file: Containerfile
      # The moonshine-python base is a manifest list covering both arches, so
      # each platform builds natively on its own runner rather than under QEMU.
      image_platforms: linux/amd64,linux/arm64
      container_push_to_registry: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
