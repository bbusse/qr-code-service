---
name: Lint Code Base

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    uses: bbusse/github-workflows/.github/workflows/shellcheck.yml@dev

  shfmt:
    name: shfmt
    uses: bbusse/github-workflows/.github/workflows/run-shfmt.yml@dev

  python-lint:
    name: Lint python
    uses: bbusse/github-workflows/.github/workflows/run-python-lint.yml@dev
